  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 20%, #f4f6fd 0%, #e9edf7 55%, #dfe4f2 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      overflow-x: hidden;
    }

    /* Ambient 3D Glows */
    .ambient-1 {
      position: fixed;
      top: -120px;
      right: -80px;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.45) 0%, rgba(58, 123, 213, 0.15) 50%, transparent 70%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }
    .ambient-2 {
      position: fixed;
      bottom: -100px;
      left: -80px;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.35) 0%, rgba(99, 102, 241, 0.15) 50%, transparent 70%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }

    /* Card Tokens */
    .card-tile-cyan {
      background: linear-gradient(180deg, #00d0ff 0%, #0066ff 100%);
      color: #ffffff;
      border-radius: 26px;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 16px 32px -8px rgba(0, 102, 255, 0.45);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 155px;
    }
    .card-tile-white {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 26px;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 12px 26px -6px rgba(20, 35, 75, 0.05);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 155px;
    }

    /* Bottom Oceanic Blue Dock */
    .dock-oceanic {
      background: linear-gradient(135deg, #0a193d 0%, #032b5e 50%, #0066eb 100%);
      border-radius: 36px;
      box-shadow: 0 20px 40px -10px rgba(3, 43, 94, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      margin: 0 16px 16px 16px;
      padding: 10px 20px;
    }

    .floating-center-plus {
      background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      font-weight: 300;
      box-shadow: 0 12px 26px -4px rgba(0, 210, 255, 0.7);
      border: 3.5px solid #ffffff;
      transform: translateY(-20px);
      cursor: pointer;
    }

    /* Range Slider */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 7px;
      background: #e2e8f0;
      border-radius: 9999px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
      cursor: pointer;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 12px rgba(0, 114, 255, 0.6);
    }

    .hide-sb::-webkit-scrollbar { display: none; }
    .hide-sb { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

            <div>

      if (abs >= 100000) return '₹' + (n / 100000).toFixed(2) + ' L';
      return '₹' + Math.round(n).toLocaleString('en-IN');
    }

    function setHolder(h) {
      curHolder = h;
      document.getElementById('mHolderName').innerText = h === 'All' ? 'PRAMESH SHAH' : h.toUpperCase();
      render();
    }

    function switchScreen(s) {
      activeScreen = s;
      ['tabS1', 'tabS2', 'tabS3', 'tabS4'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.className = 'text-white/70 hover:text-white transition';
      });
      const map = { 'screen1': 'tabS1', 'screen2': 'tabS2', 'screen3': 'tabS3', 'screen4': 'tabS4' };
      document.getElementById(map[s]).className = 'text-cyan-400 font-black transition';
      render();
    }

    function toggleRecd(id) {
      if (recdMap[id]) delete recdMap[id];
      else recdMap[id] = true;
      localStorage.setItem('cf_recd', JSON.stringify(recdMap));
      render();
    }

    function openModal(t) {
      document.getElementById('addModal').classList.remove('hidden');
      setModalTab(t || 'bond');
    }

    function closeModal() {
      document.getElementById('addModal').classList.add('hidden');
    }

    function setModalTab(t) {
      modalTab = t;
      const bBond = document.getElementById('mBtnBond');
      const bIns = document.getElementById('mBtnIns');
      const sBond = document.getElementById('mSecBond');
      const sIns = document.getElementById('mSecIns');
      const mTitle = document.getElementById('mTitle');

      if (t === 'bond') {
        bBond.className = 'py-1.5 rounded-xl bg-blue-600 text-white transition';
        bIns.className = 'py-1.5 rounded-xl text-slate-500 transition';
        sBond.classList.remove('hidden');
        sIns.classList.add('hidden');
        mTitle.innerText = 'Add Investment (ISIN Req.)';
      } else {
        bIns.className = 'py-1.5 rounded-xl bg-blue-600 text-white transition';
        bBond.className = 'py-1.5 rounded-xl text-slate-500 transition';
        sIns.classList.remove('hidden');
        sBond.classList.add('hidden');
        mTitle.innerText = 'Add Insurance (Smart PPT)';
      }
    }

    function handleModalSubmit(e) {
      e.preventDefault();
      const holder = document.getElementById('fHolder').value;

      if (modalTab === 'bond') {
        const isin = document.getElementById('fIsin').value.trim().toUpperCase();
        if (!isin || isin.length !== 12) {
          alert('⚠️ MANDATORY ISIN: Must be exactly 12 alphanumeric characters.');
          document.getElementById('fIsin').focus();
          return;
        }
        const name = document.getElementById('fBondName').value.trim() || 'Bond';
        const fv = parseFloat(document.getElementById('fFaceValue').value) || 0;
        const c = parseFloat(document.getElementById('fCoupon').value) || 0;
        const freq = document.getElementById('fFreq').value;
        const d = document.getElementById('fDate').value || '2025-05-24';

        const numInst = freq === 'annual' ? 1 : (freq === 'quarter' ? 4 : 2);
        const annAmt = (fv * c) / 100;
        const instAmt = annAmt / numInst;

        for (let i = 0; i < numInst; i++) {
          userTxs.unshift({
            id: `tx_u_${Date.now()}_${i}`,
            date: d,
            holder: holder,
            asset: name,
            type: 'Traded Bonds',
            amount: Math.round(instAmt),
            maturity_date: '2034-05-24',
            isin: isin,
            coupon: c,
            face_value: fv
          });
        }

        userHoldings.push({
          id: `h_u_${Date.now()}`,
          portfolio: holder,
          asset_name: name,
          isin: isin,
          coupon_pct: c,
          annual_gross: annAmt,
          face_value: fv
        });

        alert(`✅ Bond Saved with ISIN ${isin}!`);
      } else {
        const name = document.getElementById('fPolName').value || 'Life Cover';
        const prem = parseFloat(document.getElementById('fPremium').value) || 50000;
        const ppt = parseInt(document.getElementById('fPPT').value) || 10;

        userIns.push({
          id: `ins_u_${Date.now()}`,
          holder: holder,
          policy_name: name,
          premium: prem,
          ppt_years: ppt,
          issue_date: '2024-01-01',
          renewal_date: '12-22'
        });

        alert(`✅ Insurance Policy Saved with ${ppt}-Year Smart PPT!`);
      }

      localStorage.setItem('cf_txs', JSON.stringify(userTxs));
      localStorage.setItem('cf_holdings', JSON.stringify(userHoldings));
      localStorage.setItem('cf_ins', JSON.stringify(userIns));
      closeModal();
      render();
    }

    function render() {
      // Render Holder Pills
      document.getElementById('holderPills').innerHTML = HOLDERS.map(h => `
        <button onclick="setHolder('${h.id}')" class="px-3.5 py-1.5 rounded-full text-xs font-black whitespace-nowrap transition ${h.id === curHolder ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-sm' : 'bg-white/80 text-slate-600'}">
          ${h.name}
        </button>
      `).join('');

      let txs = userTxs.filter(t => curHolder === 'All' || t.holder.toUpperCase() === curHolder.toUpperCase());
      let totIn = 0, recdIn = 0;
      txs.forEach(t => {
        totIn += t.amount;
        if (recdMap[t.id]) recdIn += t.amount;
      });

      let totIns = 0;
      userIns.forEach(ins => {
        if (curHolder !== 'All' && ins.holder.toUpperCase() !== curHolder.toUpperCase()) return;
        const sy = parseInt(ins.issue_date ? ins.issue_date.slice(0, 4) : 2024);
        const ppt = parseInt(ins.ppt_years || 10);
        if (2025 >= sy && 2025 < sy + ppt) totIns += ins.premium;
      });

      let totMat = 0, sgbGrams = 0;
      userHoldings.forEach(h => {
        if (curHolder !== 'All' && h.portfolio.toUpperCase() !== curHolder.toUpperCase()) return;
        if (h.grams > 0) {
          sgbGrams += h.grams;
          totMat += (h.grams * sgbPrice);
        } else {
          totMat += (h.face_value || 0);
        }
      });

      const container = document.getElementById('screenContainer');

      if (activeScreen === 'screen1') {
        container.innerHTML = `
          <!-- 4 Cards Grid (Exact Reference Screen 1) -->
          <div class="grid grid-cols-2 gap-3.5">
            <div class="card-tile-cyan">
              <div class="w-10 h-10 rounded-2xl bg-white/20 backdrop-blur-md flex items-center justify-center">
                <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83" /><path d="M22 12A10 10 0 0 0 12 2v10z" /></svg>
              </div>
              <div>
                <span class="text-[10px] font-black text-white/80 uppercase tracking-wider block">Total Inflow</span>
                <div class="text-xl font-black text-white tracking-tight mt-0.5">${fmtShort(totIn)}</div>
                <span class="text-[9px] text-white/75 font-semibold block mt-0.5">${txs.length} Coupons</span>
              </div>
            </div>

            <div class="card-tile-white">
              <div class="w-10 h-10 rounded-2xl bg-slate-100 flex items-center justify-center text-slate-700">
                <svg class="w-5 h-5 text-slate-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="20" x2="18" y2="10" /><line x1="12" y1="20" x2="12" y2="4" /><line x1="6" y1="20" x2="6" y2="14" /></svg>
              </div>
              <div>
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-wider block">Net Surplus</span>
                <div class="text-xl font-black text-slate-800 tracking-tight mt-0.5">${fmtShort(totIn - totIns)}</div>
                <span class="text-[9px] text-emerald-600 font-black block mt-0.5">+ Cash Positive</span>
              </div>
            </div>

            <div class="card-tile-white" onclick="switchScreen('screen4')">
              <div class="w-10 h-10 rounded-2xl bg-rose-50 flex items-center justify-center text-rose-500">
                <svg class="w-5 h-5 text-rose-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path></svg>
              </div>
              <div>
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-wider block">Insurance (PPT)</span>
                <div class="text-xl font-black text-rose-500 tracking-tight mt-0.5">${fmt(totIns)}</div>
                <span class="text-[9px] text-blue-600 font-bold block mt-0.5">Smart PPT Active</span>
              </div>
            </div>

            <div class="card-tile-white" onclick="switchScreen('screen3')">
              <div class="w-10 h-10 rounded-2xl bg-amber-50 flex items-center justify-center text-amber-500">
                <svg class="w-5 h-5 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 16l-4-4-4 4" /><path d="M12 12v9" /><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3" /></svg>
              </div>
              <div>
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-wider block">Maturity Pipeline</span>
                <div class="text-xl font-black text-amber-600 tracking-tight mt-0.5">${fmtShort(totMat)}</div>
                <span class="text-[9px] text-slate-400 font-semibold block mt-0.5">260g Gold + GSecs</span>
              </div>
            </div>
          </div>

          <!-- Feed Header -->
          <div class="flex justify-between items-center px-1 pt-1">
            <span class="text-xs font-black text-slate-800 uppercase tracking-wider">Scheduled Coupons</span>
            <button onclick="openModal('bond')" class="text-[10px] font-extrabold text-blue-600 hover:underline">+ Add Bond</button>
          </div>

          <!-- Feed -->
          <div class="space-y-2">
            ${txs.map(t => {
              const isDone = !!recdMap[t.id];
              return `
                <div class="bg-white/85 backdrop-blur-md rounded-2xl p-3 border border-white flex justify-between items-center shadow-xs">
                  <div class="space-y-0.5 max-w-[65%]">
                    <div class="flex items-center space-x-1.5 text-[9px]">
                      <span class="px-2 py-0.5 rounded-full font-black bg-blue-100 text-blue-700">${t.date}</span>
                      <span class="text-slate-400 font-bold truncate">${t.holder}</span>
                    </div>
                    <div class="text-xs font-black text-slate-800 truncate">${t.asset}</div>
                    <div class="text-[10px] text-slate-500 truncate flex items-center space-x-1">
                      <span>Coupon: <b>${t.coupon}%</b></span>
                      <span>•</span>
                      <span class="font-mono font-bold text-blue-600 bg-blue-50 px-1 rounded">${t.isin || 'N/A'}</span>
                    </div>
                  </div>
                  <div class="text-right space-y-1">
                    <div class="text-xs font-black text-emerald-600">+${fmt(t.amount)}</div>
                    <button onclick="toggleRecd('${t.id}')" class="text-[10px] font-black px-3 py-1 rounded-xl transition ${isDone ? 'bg-emerald-500 text-white shadow-sm' : 'bg-slate-100 text-slate-700 border border-slate-200'}">
                      ${isDone ? '✓ Recd' : 'Mark Recd'}
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else if (activeScreen === 'screen2') {
        const pct = Math.min(100, Math.round((recdIn / (totIn || 1)) * 100));
        const strokeOffset = 270 - (270 * pct / 100);
        container.innerHTML = `
          <div class="bg-white/85 backdrop-blur-xl rounded-3xl p-6 border border-white shadow-sm text-center space-y-3.5">
            <span class="text-xs font-black text-slate-400 tracking-widest uppercase block">Coupon Collection</span>
            <div class="relative w-48 h-48 mx-auto flex items-center justify-center">
              <svg class="w-full h-full -rotate-90" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="43" stroke="#e8ecf4" stroke-width="7" fill="transparent" />
                <circle cx="50" cy="50" r="43" stroke="url(#gBlue)" stroke-width="7.5" stroke-linecap="round" fill="transparent" style="stroke-dasharray: 270; stroke-dashoffset: ${strokeOffset}; transition: stroke-dashoffset 0.8s ease;" />
                <defs><linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00f0ff" /><stop offset="100%" stop-color="#0066ff" /></linearGradient></defs>
              </svg>
              <div class="absolute w-28 h-28 rounded-full bg-white shadow-xl flex flex-col items-center justify-center border border-slate-100">
                <span class="text-3xl font-black text-slate-800 tracking-tight">${pct}%</span>
                <span class="text-[9px] font-extrabold text-blue-600 uppercase tracking-widest mt-0.5">Reconciled</span>
              </div>
            </div>
            <div class="flex justify-center space-x-6 text-xs font-bold pt-1">
              <div class="flex items-center space-x-2"><span class="w-3 h-3 rounded-full bg-blue-500"></span><span>${fmt(recdIn)} Recd</span></div>
              <div class="flex items-center space-x-2"><span class="w-3 h-3 rounded-full bg-slate-300"></span><span class="text-slate-400">${fmt(totIn - recdIn)} Pend</span></div>
            </div>
          </div>
        `;
      } else if (activeScreen === 'screen3') {
        container.innerHTML = `
          <div class="bg-white/85 backdrop-blur-xl rounded-3xl p-5 border border-white shadow-sm space-y-3">
            <div class="text-2xl font-black text-slate-900 tracking-tight">${fmt(totMat)}</div>
            <p class="text-[10px] text-slate-400 font-medium">Multi-Decade Horizon Inflows (2025–2064)</p>
            <div class="pt-2 border-t border-slate-100 space-y-1.5">
              <div class="flex justify-between items-center text-xs">
                <span class="font-extrabold text-amber-700">🌟 SGB Gold Redemption Price</span>
                <span class="font-black text-amber-900 bg-amber-50 px-2 py-0.5 rounded-lg border border-amber-200">₹${sgbPrice.toLocaleString('en-IN')} / g</span>
              </div>
              <input type="range" min="6500" max="18000" step="250" value="${sgbPrice}" oninput="sgbPrice=parseInt(this.value); render();">
              <div class="flex justify-between text-[10px] font-bold text-slate-400">
                <span>₹6,500</span>
                <span class="text-blue-600 font-extrabold">${sgbGrams}g Gold = ${fmt(sgbGrams * sgbPrice)}</span>
                <span>₹18,000</span>
              </div>
            </div>
          </div>
        `;
      } else if (activeScreen === 'screen4') {
        container.innerHTML = `
          <div class="space-y-3">
            <div class="bg-blue-50 border border-blue-200 rounded-2xl p-3 text-xs text-blue-900">
              🛡️ <b>Smart PPT:</b> Premiums stop automatically after PPT period.
            </div>
            ${userIns.map(ins => `
              <div class="bg-white/85 rounded-2xl p-4 border border-white space-y-2 shadow-xs">
                <div class="flex justify-between items-start">
                  <div>
                    <h4 class="text-xs font-black text-slate-800">${ins.policy_name}</h4>
                    <p class="text-[10px] text-slate-400">Holder: <b>${ins.holder}</b></p>
                  </div>
                  <span class="px-2 py-0.5 rounded-full text-[9px] font-bold bg-emerald-100 text-emerald-700">PPT Active</span>
                </div>
                <div class="flex justify-between text-xs pt-1">
                  <span>Premium: <b class="text-rose-500">${fmt(ins.premium)}</b></span>
                  <span>PPT: <b class="text-blue-600">${ins.ppt_years} Yrs</b></span>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    // Real-time Clock
    function updateClock() {
      const d = new Date();
      let h = d.getHours();
      let m = d.getMinutes();
      document.getElementById('liveTime').innerText = `${h}:${m < 10 ? '0' : ''}${m}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    render();
  </script>
</body>
</html>
