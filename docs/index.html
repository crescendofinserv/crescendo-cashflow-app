<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Family Cashflow</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 20%, #eef2fc 0%, #e2e8f6 55%, #d8dff0 100%);
      color: #1e293b;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    .ambient-1 {
      position: fixed; top: -120px; right: -80px;
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(0,210,255,0.4) 0%, rgba(58,123,213,0.12) 55%, transparent 70%);
      filter: blur(70px); z-index: 0; pointer-events: none;
    }
    .ambient-2 {
      position: fixed; bottom: -100px; left: -80px;
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(168,85,247,0.3) 0%, rgba(99,102,241,0.1) 55%, transparent 70%);
      filter: blur(70px); z-index: 0; pointer-events: none;
    }
    .card-cyan {
      background: linear-gradient(160deg, #00d2ff 0%, #0055ff 100%);
      color: #fff;
      border-radius: 24px;
      border: 1.5px solid rgba(255,255,255,0.4);
      box-shadow: 0 14px 28px -6px rgba(0,85,255,0.42);
      padding: 14px;
      display: flex; flex-direction: column; justify-content: space-between;
      height: 148px;
      cursor: pointer;
    }
    .card-white {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 24px;
      border: 1.5px solid rgba(255,255,255,0.95);
      box-shadow: 0 8px 24px -5px rgba(20,35,75,0.07);
      padding: 14px;
      display: flex; flex-direction: column; justify-content: space-between;
      height: 148px;
      cursor: pointer;
    }
    .dock {
      background: linear-gradient(135deg, #0a1a3d 0%, #032b5e 55%, #0055eb 100%);
      border-radius: 32px;
      box-shadow: 0 -4px 24px -4px rgba(3,43,94,0.35), 0 16px 36px -8px rgba(3,43,94,0.55);
      border: 1.5px solid rgba(255,255,255,0.22);
      margin: 0 12px 10px 12px;
      padding: 8px 18px;
      flex-shrink: 0;
    }
    .fab {
      background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
      width: 50px; height: 50px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 26px; font-weight: 300;
      box-shadow: 0 10px 22px -4px rgba(0,210,255,0.65);
      border: 3px solid #fff;
      transform: translateY(-18px);
      cursor: pointer;
    }
    .feed-card {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 18px;
      border: 1.5px solid rgba(255,255,255,0.9);
      box-shadow: 0 4px 14px -3px rgba(20,35,75,0.07);
      padding: 10px 12px;
      cursor: pointer;
    }
    .pill-active { background: linear-gradient(90deg, #00c6ff, #0072ff); color: #fff; box-shadow: 0 4px 12px -2px rgba(0,114,255,0.4); }
    .pill-idle { background: rgba(255,255,255,0.8); color: #475569; }
    input[type=range] { -webkit-appearance: none; width: 100%; height: 6px; background: #e2e8f0; border-radius: 9999px; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg,#00d2ff,#0072ff); cursor: pointer; border: 2.5px solid #fff; box-shadow: 0 3px 10px rgba(0,114,255,0.55); }
    .hs::-webkit-scrollbar { display: none; }
    .hs { -ms-overflow-style: none; scrollbar-width: none; }
    input, select { font-size: 16px; } /* Prevent iOS zoom */
    /* Bond Detail Sheet */
    .sheet { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; background: rgba(15,23,42,0.55); backdrop-filter: blur(6px); }
    .sheet-inner { background: #fff; border-radius: 28px 28px 0 0; width: 100%; max-height: 88vh; overflow-y: auto; padding: 20px; }
    .year-bar-wrap { background: rgba(255,255,255,0.8); border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; border: 1px solid rgba(255,255,255,0.9); }
  </style>
</head>
<body>
<div class="ambient-1"></div>
<div class="ambient-2"></div>

<!-- App Shell -->

      </div>
      <div style="display:flex;align-items:center;gap:8px;">

    </div>

  <!-- Scrollable Content -->

  <!-- Fixed Dock -->
  <div class="dock" style="display:flex;justify-content:space-between;align-items:center;">
    <button onclick="switchScreen('s1')" id="t1" style="background:none;border:none;color:rgba(0,210,255,0.9);cursor:pointer;padding:6px;">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
    </button>
    <button onclick="switchScreen('s2')" id="t2" style="background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;padding:6px;">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
    </button>
    <button onclick="openModal('bond')" class="fab">+</button>
    <button onclick="switchScreen('s3')" id="t3" style="background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;padding:6px;">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>
    </button>
    <button onclick="switchScreen('s4')" id="t4" style="background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;padding:6px;">

    </button>

</div>

<!-- NOTIFICATION CENTER -->
<div id="notifCenter" style="display:none;position:fixed;inset:0;z-index:50;background:rgba(15,23,42,0.5);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px;">
  <div style="background:rgba(255,255,255,0.97);border-radius:28px;padding:20px;width:100%;max-width:400px;max-height:88vh;overflow-y:auto;" class="hs">
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f5f9;padding-bottom:10px;margin-bottom:12px;">
      <div>
        <div style="font-size:13px;font-weight:900;color:#0f172a;">Reminders</div>
        <div style="font-size:10px;color:#94a3b8;font-weight:600;">Current FY only</div>
      </div>
      <button onclick="toggleNotifCenter()" style="font-size:22px;color:#94a3b8;background:none;border:none;cursor:pointer;line-height:1;">&times;</button>
    </div>
    <div style="background:#eff6ff;border-radius:14px;padding:10px;font-size:10px;color:#1e40af;margin-bottom:10px;line-height:1.6;">
      🔔 <b>Interest:</b> 1 day prior + daily until Mark Recd<br>
      🛡️ <b>Insurance:</b> 15 days prior + daily until Mark Paid
    </div>
    <div id="notifList"></div>
  </div>
</div>

<!-- BOND DETAIL SHEET -->
<div id="detailSheet" class="sheet" style="display:none;" onclick="if(event.target===this)closeDetail()">
  <div class="sheet-inner hs" id="detailInner"></div>
</div>

<!-- ADD MODAL -->
<div id="addModal" style="display:none;position:fixed;inset:0;z-index:50;background:rgba(15,23,42,0.5);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:16px;">
  <div style="background:rgba(255,255,255,0.97);border-radius:28px;padding:20px;width:100%;max-width:400px;max-height:92vh;overflow-y:auto;" class="hs">

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#f1f5f9;padding:4px;border-radius:16px;margin-bottom:14px;">

              <option value="annual">Annual</option>

        </div>
      </div>
      <div id="mSecIns" style="display:none;flex-direction:column;gap:8px;">
        <div>
          <label style="display:block;color:#64748b;font-weight:700;margin-bottom:4px;">Policy Name</label>

        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div>
            <label style="display:block;color:#64748b;font-weight:700;margin-bottom:4px;">Annual Premium (₹)</label>
            <input type="number" id="fPremium" placeholder="67741" style="width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:8px 10px;color:#ef4444;font-weight:900;outline:none;">
          </div>
          <div>
            <label style="display:block;color:#2563eb;font-weight:700;margin-bottom:4px;">PPT (Yrs)</label>
            <input type="number" id="fPPT" value="10" style="width:100%;background:#eff6ff;border:1.5px solid #3b82f6;border-radius:14px;padding:8px 10px;color:#1e40af;font-weight:900;text-align:center;outline:none;">
          </div>
        </div>
        <div>
          <label style="display:block;color:#64748b;font-weight:700;margin-bottom:4px;">Next Due Date</label>
          <input type="date" id="fInsDue" style="width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:8px 10px;color:#1e293b;outline:none;">
        </div>
        <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:8px;font-size:10px;color:#1e40af;">
          ⚡ <b>Smart PPT:</b> Premium stops automatically after PPT years.
        </div>
      </div>
      <button type="submit" style="width:100%;padding:11px;border-radius:18px;background:linear-gradient(135deg,#06b6d4,#2563eb);color:#fff;font-weight:900;font-size:12px;border:none;box-shadow:0 8px 18px -4px rgba(37,99,235,0.4);cursor:pointer;">Save to Portfolio</button>
    </form>
  </div>
</div>

// ── Utils ──────────────────────────────────────────────────────────
function fmt(n)      { return '₹' + Math.round(n).toLocaleString('en-IN'); }
function fmtShort(n) {
  if (n >= 1e7) return '₹' + (n/1e7).toFixed(1) + 'Cr';
  if (n >= 1e5) return '₹' + (n/1e5).toFixed(1) + 'L';
  return '₹' + Math.round(n).toLocaleString('en-IN');
}
function ddmmyyyy(dateStr) {
  // Convert yyyy-mm-dd or "dd-Mon" patterns to dd-mm-yyyy
  if (!dateStr) return '';
  // If already has dashes and length==10, assume yyyy-mm-dd
  if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
    const [y, m, d] = dateStr.split('-');
    return d + '-' + m + '-' + y;
  }
  return dateStr;
}
function parseDate(s) {
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s);
  return null;
}
function diffDays(dateStr) {
  const d = parseDate(dateStr);
  if (!d) return 9999;
  return Math.floor((d - new Date(new Date().toDateString())) / 86400000);
}

// ── Notifications ──────────────────────────────────────────────────
function getActiveNotifications() {
  const alerts = [];
  const today = new Date(new Date().toDateString());

  // Interest: txs in current FY
  userTxs.forEach(t => {
    const d = parseDate(t.date);
    if (!d) return;
    if (d < FY_START || d > FY_END) return; // only current FY
    const diff = Math.floor((d - today) / 86400000);
    if (diff === 1 || (diff <= 0 && !recdMap[t.id])) {
      alerts.push({ type: 'interest', id: t.id, label: t.asset, amount: t.amount, date: t.date, holder: t.holder, diff });
    }
  });

  // Insurance: upcoming payments
  userIns.forEach(ins => {
    if (!ins.next_due) return;
    const d = parseDate(ins.next_due);
    if (!d) return;
    const diff = Math.floor((d - today) / 86400000);
    if ((diff <= 15 && diff > 0) || (diff <= 0 && !paidMap[ins.id])) {
      alerts.push({ type: 'insurance', id: ins.id, label: ins.policy_name, amount: ins.premium, date: ins.next_due, holder: ins.holder, diff });
    }
  });
  return alerts;
}

            <span style="font-size:9px;font-weight:900;color:rgba(255,255,255,0.78);text-transform:uppercase;letter-spacing:0.1em;display:block;">FY Inflow</span>
            <div style="font-size:20px;font-weight:900;color:#fff;margin:2px 0;">${fmtShort(totIn)}</div>
            <span style="font-size:9px;color:rgba(255,255,255,0.7);font-weight:700;">${fyTxs.length} coupons • Apr–Mar</span>
          </div>
        </div>
        <div class="card-white" onclick="switchScreen('s2')">
          <div style="width:38px;height:38px;border-radius:14px;background:#f0fdf4;display:flex;align-items:center;justify-content:center;">
            <svg width="18" height="18" fill="none" stroke="#16a34a" stroke-width="2.2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          </div>
          <div>
            <span style="font-size:9px;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:0.1em;display:block;">Net Surplus (FY)</span>
            <div style="font-size:20px;font-weight:900;color:#0f172a;margin:2px 0;">${fmtShort(totIn - totIns)}</div>
            <span style="font-size:9px;color:#16a34a;font-weight:900;">−${fmtShort(totIns)} Insurance</span>
          </div>
        </div>
        <div class="card-white" onclick="switchScreen('s4')">
          <div style="width:38px;height:38px;border-radius:14px;background:#fff7ed;display:flex;align-items:center;justify-content:center;">
            <svg width="18" height="18" fill="none" stroke="#ea580c" stroke-width="2.2" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/></svg>
          </div>
          <div>
            <span style="font-size:9px;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:0.1em;display:block;">Insurance</span>
            <div style="font-size:20px;font-weight:900;color:#ea580c;margin:2px 0;">${fmtShort(totIns)}</div>
            <span style="font-size:9px;color:#2563eb;font-weight:700;">Smart PPT Active</span>
          </div>
        </div>
        <div class="card-white" onclick="switchScreen('s3')">
          <div style="width:38px;height:38px;border-radius:14px;background:#fffbeb;display:flex;align-items:center;justify-content:center;">
            <svg width="18" height="18" fill="none" stroke="#d97706" stroke-width="2.2" viewBox="0 0 24 24"><path d="M16 16l-4-4-4 4"/><path d="M12 12v9"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
          </div>
          <div>
            <span style="font-size:9px;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:0.1em;display:block;">Maturity Pipeline</span>
            <div style="font-size:20px;font-weight:900;color:#d97706;margin:2px 0;">${fmtShort(totMat)}</div>
            <span style="font-size:9px;color:#64748b;font-weight:600;">${sgbGrams}g Gold + GSecs</span>
          </div>
        </div>
      </div>

      <!-- Holdings list with drill-down -->
      <div style="display:flex;justify-content:space-between;align-items:center;padding:2px 2px 0;">
        <span style="font-size:11px;font-weight:900;color:#0f172a;text-transform:uppercase;letter-spacing:0.06em;">Holdings (${holdings.length})</span>
        <button onclick="openModal('bond')" style="font-size:10px;font-weight:800;color:#2563eb;background:none;border:none;cursor:pointer;">+ Add Bond</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${holdings.map(h => {
          const nextTx = userTxs.filter(t=>t.isin===h.isin).sort((a,b)=>a.date.localeCompare(b.date)).find(t=>!recdMap[t.id] && parseDate(t.date)>=new Date(new Date().toDateString()));
          const nextDate = nextTx ? ddmmyyyy(nextTx.date) : '—';
          const nextAmt  = nextTx ? nextTx.amount : 0;
          return `<div class="feed-card" onclick="openDetail('${h.id}')">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px;">
              <div style="max-width:68%;">
                <div style="font-size:11px;font-weight:900;color:#0f172a;line-height:1.3;">${h.asset_name}</div>
                <div style="font-size:9px;color:#64748b;margin-top:2px;">${h.portfolio}</div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:12px;font-weight:900;color:#16a34a;">${fmt(h.annual_gross)}<span style="font-size:9px;color:#94a3b8;font-weight:600;">/yr</span></div>
                <div style="font-size:9px;color:#2563eb;font-weight:700;background:#eff6ff;border-radius:6px;padding:1px 6px;display:inline-block;margin-top:2px;">${h.coupon_pct}%</div>
              </div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding-top:5px;border-top:1px solid #f1f5f9;">
              <div style="font-size:9px;color:#64748b;">
                <span style="font-weight:700;color:#475569;font-family:monospace;">${h.isin}</span>
                ${h.grams > 0 ? ` • <span style="color:#b45309;font-weight:700;">${h.grams}g 🥇</span>` : ''}
              </div>
              <div style="text-align:right;font-size:9px;color:#64748b;">
                Next: <b style="color:#d97706;">${nextDate}</b>${nextAmt?(' · '+fmt(nextAmt)):''}
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    `;

  // ── SCREEN 2: FY Inflow by Month + Pending Feed ──────────────────
  } else if (activeScreen === 's2') {
    const months = ['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
    // Build FY monthly buckets
    const byMonth = {};
    months.forEach((m,i) => { byMonth[m] = {total:0, recd:0}; });
    fyTxs.forEach(t => {
      const d = parseDate(t.date);
      if (!d) return;
      const mo = d.toLocaleString('en-US',{month:'short'});
      if (byMonth[mo] !== undefined) {
        byMonth[mo].total += t.amount;
        if (recdMap[t.id]) byMonth[mo].recd += t.amount;
      }
    });
    const maxMonthVal = Math.max(...Object.values(byMonth).map(v=>v.total), 1);

    const pct = Math.min(100, Math.round((recdIn / (totIn||1)) * 100));
    const sdo = 270 - (270*pct/100);

    container.innerHTML = `
      <!-- Gauge -->
      <div style="background:rgba(255,255,255,0.88);backdrop-filter:blur(16px);border-radius:24px;padding:20px;border:1.5px solid rgba(255,255,255,0.9);box-shadow:0 8px 24px -5px rgba(20,35,75,0.07);text-align:center;">
        <span style="font-size:10px;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:0.1em;">FY Collection Progress</span>
        <div style="position:relative;width:160px;height:160px;margin:10px auto;display:flex;align-items:center;justify-content:center;">
          <svg style="width:100%;height:100%;transform:rotate(-90deg);" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="43" stroke="#e8ecf4" stroke-width="7" fill="transparent"/>
            <circle cx="50" cy="50" r="43" stroke="url(#gBlue)" stroke-width="7.5" stroke-linecap="round" fill="transparent" style="stroke-dasharray:270;stroke-dashoffset:${sdo};transition:stroke-dashoffset 0.8s ease;"/>
            <defs><linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00f0ff"/><stop offset="100%" stop-color="#0066ff"/></linearGradient></defs>
          </svg>
          <div style="position:absolute;width:96px;height:96px;border-radius:50%;background:#fff;box-shadow:0 8px 20px -4px rgba(20,35,75,0.12);display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #f1f5f9;">
            <span style="font-size:28px;font-weight:900;color:#0f172a;">${pct}%</span>
            <span style="font-size:8px;font-weight:900;color:#2563eb;text-transform:uppercase;letter-spacing:0.1em;">Reconciled</span>
          </div>
        </div>
        <div style="display:flex;justify-content:center;gap:20px;font-size:11px;font-weight:700;">
          <div style="display:flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;border-radius:50%;background:#3b82f6;display:block;"></span>${fmt(recdIn)} Recd</div>
          <div style="display:flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;border-radius:50%;background:#e2e8f0;display:block;"></span><span style="color:#94a3b8;">${fmt(totIn-recdIn)} Pending</span></div>
        </div>
      </div>

      <!-- Monthly Bar Chart -->
      <div style="background:rgba(255,255,255,0.88);backdrop-filter:blur(16px);border-radius:24px;padding:16px;border:1.5px solid rgba(255,255,255,0.9);box-shadow:0 8px 24px -5px rgba(20,35,75,0.07);">
        <div style="font-size:11px;font-weight:900;color:#0f172a;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.06em;">Inflow by Month (FY 2026-27)</div>
        <div style="display:flex;align-items:flex-end;gap:3px;height:80px;">
          ${months.map(m => {
            const v = byMonth[m].total;
            const barH = v > 0 ? Math.max(8, Math.round((v/maxMonthVal)*72)) : 4;
            const isActive = byMonth[m].total > 0;
            return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;">
              <div style="font-size:7px;font-weight:700;color:#64748b;">${v>0?fmtShort(v).replace('₹',''):''}</div>
              <div style="width:100%;height:${barH}px;border-radius:4px;background:${isActive?'linear-gradient(180deg,#06b6d4,#2563eb)':'#e2e8f0'};"></div>
              <div style="font-size:7.5px;font-weight:800;color:${isActive?'#0f172a':'#cbd5e1'};">${m}</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <!-- Pending Coupons -->
      <div style="font-size:11px;font-weight:900;color:#0f172a;text-transform:uppercase;letter-spacing:0.06em;padding:2px 2px 0;">
        Current FY Coupons (${fyTxs.length})
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        ${fyTxs.sort((a,b)=>a.date.localeCompare(b.date)).map(t => {
          const done = !!recdMap[t.id];
          return `<div style="background:${done?'rgba(240,253,244,0.9)':'rgba(255,255,255,0.88)'};backdrop-filter:blur(14px);border-radius:16px;padding:10px 12px;border:1.5px solid ${done?'#bbf7d0':'rgba(255,255,255,0.9)'};box-shadow:0 3px 10px -2px rgba(20,35,75,0.06);display:flex;justify-content:space-between;align-items:center;">
            <div>
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
                <span style="font-size:9px;font-weight:900;background:#eff6ff;color:#2563eb;padding:2px 7px;border-radius:9999px;">${ddmmyyyy(t.date)}</span>
                <span style="font-size:9px;color:#64748b;font-weight:600;">${t.holder.split(' ')[0]}</span>
              </div>
              <div style="font-size:11px;font-weight:900;color:#0f172a;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${t.asset}</div>
              <div style="font-size:9px;color:#64748b;margin-top:1px;">${t.coupon}% · <span style="font-family:monospace;color:#2563eb;">${t.isin}</span></div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:12px;font-weight:900;color:#16a34a;">+${fmt(t.amount)}</div>
              <button onclick="toggleRecd('${t.id}')" style="font-size:9px;font-weight:900;padding:4px 10px;border-radius:10px;border:none;cursor:pointer;margin-top:4px;background:${done?'#22c55e':'#f1f5f9'};color:${done?'#fff':'#374151'};">${done?'✓ Recd':'Mark Recd'}</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    `;

  // ── SCREEN 3: Maturity by Year ──────────────────────────────────
  } else if (activeScreen === 's3') {
    const holdings = userHoldings.filter(h => curHolder==='All' || h.portfolio.toUpperCase()===curHolder.toUpperCase());
    // Group by maturity year
    const byYear = {};
    holdings.forEach(h => {
      const yr = (h.maturity_date||'9999').slice(0,4);
      if (!byYear[yr]) byYear[yr] = { count:0, fv:0, grams:0, items:[] };
      byYear[yr].count++;
      byYear[yr].fv += (h.face_value||0);
      byYear[yr].grams += (h.grams||0);
      byYear[yr].items.push(h);
    });
    const years = Object.keys(byYear).sort();
    const maxFV = Math.max(...Object.values(byYear).map(v=>v.fv + v.grams*sgbPrice), 1);

    container.innerHTML = `
      <div style="background:rgba(255,255,255,0.88);backdrop-filter:blur(16px);border-radius:24px;padding:18px;border:1.5px solid rgba(255,255,255,0.9);box-shadow:0 8px 24px -5px rgba(20,35,75,0.07);">
        <div style="font-size:12px;font-weight:900;color:#0f172a;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.06em;">Maturity by Year</div>
        <div style="font-size:22px;font-weight:900;color:#d97706;">${fmtShort(totMat)}</div>
        <div style="font-size:9px;color:#64748b;margin-bottom:14px;">${sgbGrams}g Gold · ${years.length} maturity buckets</div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:10px;color:#64748b;font-weight:700;">
          <span>SGB Price: <b style="color:#b45309;">₹${sgbPrice.toLocaleString('en-IN')}/g</b></span>
        </div>
        <input type="range" min="6500" max="18000" step="250" value="${sgbPrice}" oninput="sgbPrice=parseInt(this.value);render();" style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;font-size:9px;color:#94a3b8;font-weight:600;margin-bottom:12px;">
          <span>₹6,500</span><span style="color:#2563eb;font-weight:800;">${sgbGrams}g = ${fmt(sgbGrams*sgbPrice)}</span><span>₹18,000</span>
        </div>
      </div>

      ${years.map(yr => {
        const yv = byYear[yr];
        const total = yv.fv + yv.grams * sgbPrice;
        const barW = Math.max(6, Math.round((total/maxFV)*100));
        return `<div class="year-bar-wrap">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <span style="font-size:12px;font-weight:900;color:#0f172a;">${yr}</span>
            <span style="font-size:12px;font-weight:900;color:#d97706;">${fmtShort(total)}</span>
          </div>
          <div style="width:100%;height:8px;background:#f1f5f9;border-radius:9999px;overflow:hidden;margin-bottom:5px;">
            <div style="height:100%;width:${barW}%;border-radius:9999px;background:linear-gradient(90deg,#f59e0b,#d97706);"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:9px;color:#64748b;font-weight:600;">
            <span>${yv.count} holding${yv.count>1?'s':''}</span>
            ${yv.grams>0?`<span style="color:#b45309;">${yv.grams}g 🥇</span>`:''}
            <span>FV: ${fmtShort(yv.fv)}</span>
          </div>
          <div style="margin-top:6px;display:flex;flex-direction:column;gap:3px;">
            ${yv.items.map(h=>`<div style="font-size:9px;color:#475569;padding:3px 0;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;">
              <span style="max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${h.asset_name.split('(')[0].trim()}</span>
              <span style="font-weight:700;">${fmt(h.grams>0?h.grams*sgbPrice:h.face_value)}</span>
            </div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    `;

  // ── SCREEN 4: Insurance ─────────────────────────────────────────
  } else if (activeScreen === 's4') {
    const ins = userIns.filter(i => curHolder==='All' || i.holder.toUpperCase()===curHolder.toUpperCase());
    container.innerHTML = `
      <div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:16px;padding:10px 14px;font-size:11px;color:#9a3412;font-weight:600;">
        🛡️ <b>Smart PPT:</b> Premiums automatically stop after your PPT period ends.
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:2px 2px 0;">
        <span style="font-size:11px;font-weight:900;color:#0f172a;text-transform:uppercase;letter-spacing:0.06em;">${ins.length} Policies</span>
        <button onclick="openModal('ins')" style="font-size:10px;font-weight:800;color:#ea580c;background:none;border:none;cursor:pointer;">+ Add Policy</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${ins.map(p => {
          const done = !!paidMap[p.id];
          const d = diffDays(p.next_due);
          const dLabel = d===0?'Due Today':d<0?`${-d}d overdue`:d<=15?`Due in ${d}d`:`Due ${ddmmyyyy(p.next_due)}`;
          const isAlert = d<=15;
          return `<div style="background:rgba(255,255,255,0.88);backdrop-filter:blur(14px);border-radius:18px;padding:14px;border:1.5px solid ${done?'#bbf7d0':isAlert?'#fde68a':'rgba(255,255,255,0.9)'};box-shadow:0 4px 14px -3px rgba(20,35,75,0.07);">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
              <div style="max-width:70%;">
                <div style="font-size:12px;font-weight:900;color:#0f172a;">${p.policy_name}</div>
                <div style="font-size:9px;color:#64748b;margin-top:2px;">${p.holder} · PPT: <b style="color:#2563eb;">${p.ppt_years} yrs</b></div>
              </div>
              <span style="font-size:9px;font-weight:800;padding:3px 8px;border-radius:9999px;background:${done?'#dcfce7':isAlert?'#fef3c7':'#f0fdf4'};color:${done?'#16a34a':isAlert?'#92400e':'#15803d'};">${done?'Paid':isAlert?'⚠️ Alert':'PPT Active'}</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <div style="font-size:14px;font-weight:900;color:#ea580c;">${fmt(p.premium)}</div>
                <div style="font-size:9px;color:${isAlert?'#d97706':'#94a3b8'};font-weight:700;">${dLabel}</div>
              </div>
              <button onclick="togglePaid('${p.id}')" style="font-size:10px;font-weight:900;padding:6px 14px;border-radius:12px;border:none;cursor:pointer;background:${done?'#22c55e':'#fef3c7'};color:${done?'#fff':'#78350f'};">${done?'✓ Paid':'Mark Paid'}</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    `;
  }
}

// ── Clock ──────────────────────────────────────────────────────────
function tick() {
  const d=new Date(), h=d.getHours(), m=d.getMinutes();
  document.getElementById('liveClock').textContent = h+':'+(m<10?'0':'')+m;
}
setInterval(tick, 1000); tick();

// ── Init ───────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
