name: Build Android APK & Deploy Web App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Crescendo-Cashflow-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crescendo-Cashflow-APK
          path: release-output/Crescendo-Cashflow-v1.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Crescendo CashFlow Android Release v1.0.0"
          body: |
            ### 📱 Crescendo CashFlow & Wealth Tracker - Android APK
            
            - **Theme**: Luxury Gradient Glassmorphism (Cyan & Sapphire Blue with 3D Ambient Lighting)
            - **Portfolio Data**: All 90 real cashflow coupons & 46 holdings included
            - **Features**:
              - 📊 Total Inflow, Net Surplus, Smart PPT Outflow & Maturity Pipeline
              - 🎯 Reconcile coupons with interactive "Mark Recd"
              - 🌟 SGB Gold Redemption Slider
              - 🔒 Add Bonds with Mandatory 12-character ISIN
              - 🛡️ Add Insurance with Smart PPT (auto-ceases outflow after PPT)
            
            **Download and install the APK on your Android device below:**
          files: release-output/Crescendo-Cashflow-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-apk
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'www'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
