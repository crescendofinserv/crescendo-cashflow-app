<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cashflow - Family Cashflow</title>
  <style>

    :root {
      --bg-main: #f8faf9;
      --card-bg: #ffffff;
      --card-border: #e9ecef;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --brand-green: #0a3e2f;
      --brand-green-hover: #072a20;
      --accent-mint-bg: #ecfdf5;
      --accent-mint-text: #047857;
      --accent-mint-badge: #d1fae5;
      --accent-coral-bg: #fef2f2;
      --accent-coral-text: #dc2626;
      --accent-coral-badge: #fee2e2;
      --accent-gold: #b45309;
      --accent-gold-bg: #fef3c7;
      --accent-blue: #0284c7;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-dark);
      user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
    }

    .app-shell {
      overflow-x: hidden;
      position: relative;
      max-width: 460px;
      width: 100%;
      margin: 0 auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg-main);
    }

    /* Top Android Status Bar */
    .top-status-bar {
      padding: 10px 20px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* Cashflow Header */
    .app-header {
      padding: 8px 20px 8px;
      flex-shrink: 0;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .header-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .header-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: 500;
    }
    .notif-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      color: var(--text-dark);
      transition: all 0.15s ease;
    }
    .notif-btn:active {
      transform: scale(0.94);
      background: #f1f5f9;
    }
    .notif-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      background: var(--accent-coral-text);
      border: 2px solid #ffffff;
      border-radius: 50%;
    }

    /* FY Selector & Member Pills */
    .fy-selector-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 14px;
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      margin-top: 8px;
      font-size: 12.5px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .fy-selector-row b {
      color: var(--text-dark);
      font-weight: 700;
      margin-left: 4px;
    }

    .member-scroll-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 20px 4px;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .member-scroll-bar::-webkit-scrollbar { display: none; }
    .member-chip {
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 11.5px;
      font-weight: 700;
      border: 1px solid var(--card-border);
      background: #ffffff;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .member-chip.active {
      background: var(--brand-green);
      color: #ffffff;
      border-color: var(--brand-green);
      box-shadow: 0 3px 10px rgba(10, 62, 47, 0.22);
    }

    /* Main Viewport */
    .main-viewport {
      overflow-x: hidden;
      flex: 1;
      overflow-y: auto;
      padding: 8px 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: none;
    }
    .main-viewport::-webkit-scrollbar { display: none; }

    /* Clean White Cards */
    .clean-card {
      background: var(--card-bg);
      border-radius: 18px;
      border: 1px solid var(--card-border);
      padding: 16px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
    }

    /* 2-Column Summary Cards */
    .stat-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-box {
      background: #ffffff;
      border-radius: 18px;
      border: 1px solid var(--card-border);
      padding: 14px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .stat-box:active {
      transform: scale(0.98);
    }
    .icon-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }
    .icon-circle.inflow {
      background: var(--accent-mint-bg);
      color: var(--accent-mint-text);
    }
    .icon-circle.outflow {
      background: var(--accent-coral-bg);
      color: var(--accent-coral-text);
    }
    .stat-lbl {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .stat-amt {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-dark);
      margin: 4px 0 2px;
      letter-spacing: -0.02em;
    }
    .stat-sub {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text-light);
    }

    /* Net Cashflow Wide Card */
    .net-cashflow-card {
      background: #ffffff;
      border-radius: 18px;
      border: 1px solid var(--card-border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
    }
    .net-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .net-icon-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--accent-mint-bg);
      color: var(--accent-mint-text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .net-amt {
      font-size: 21px;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.02em;
    }
    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
    }
    .pill-badge.surplus {
      background: var(--accent-mint-badge);
      color: var(--accent-mint-text);
    }

    /* Monthly Cashflow Chart */
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .chart-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-dark);
    }
    .chart-link {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .chart-link:hover {
      color: var(--brand-green);
    }
    .chart-bars-container {
      display: flex;
      align-items: flex-end;
      height: 94px;
      gap: 4px;
      padding-bottom: 4px;
    }
    .chart-month-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      height: 100%;
      justify-content: flex-end;
    }
    .bar-group {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      width: 100%;
      justify-content: center;
    }
    .bar-single {
      border-radius: 3px 3px 0 0;
      transition: height 0.3s ease;
    }
    .bar-single.inflow {
      background: var(--brand-green);
      width: 5px;
    }
    .bar-single.outflow {
      background: #f87171;
      width: 5px;
    }
    .month-lbl {
      font-size: 8px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .chart-legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 10px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    /* Quick Links 2-Column */
    .quick-links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .quick-link-box {
      background: #ffffff;
      border-radius: 18px;
      border: 1px solid var(--card-border);
      padding: 14px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 82px;
      transition: all 0.2s ease;
    }
    .quick-link-box:active {
      transform: scale(0.98);
      background: #f8fafc;
    }
    .ql-icon-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ql-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent-mint-bg);
      color: var(--accent-mint-text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ql-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-dark);
      margin-top: 8px;
    }
    .ql-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* Subpage Header */
    .subpage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px 10px;
    }
    .subpage-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-dark);
      text-align: center;
    }
    .subpage-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 1px;
    }

    /* Segmented Control Toggle */
    .segmented-control {
      display: flex;
      background: #eef2ef;
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 6px;
    }
    .seg-btn {
      flex: 1;
      padding: 7px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 700;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .seg-btn.active {
      background: #ffffff;
      color: var(--brand-green);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    /* Month Navigator < April 2026 > */
    .month-nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-dark);
    }
    .nav-arrow-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-dark);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }
    .nav-arrow-btn:active {
      background: #f1f5f9;
    }

    /* Month Total Banner Card */
    .month-banner-card {
      background: #ffffff;
      border-radius: 18px;
      border: 1px solid var(--card-border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
    }
    .month-banner-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Coupon Items in Month */
    .coupon-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      transition: all 0.2s ease;
    }
    .coupon-card.recd {
      background: #f8faf9;
      border-color: #d1fae5;
    }
    .coupon-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.25;
    }
    .coupon-date-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 3px;
    }
    .coupon-amt {
      font-size: 14px;
      font-weight: 800;
      color: var(--accent-mint-text);
      text-align: right;
    }
    .coupon-action-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      justify-content: flex-end;
    }
    .btn-mark-recd {
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 10.5px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-mark-recd.pending {
      background: #f1f5f9;
      color: var(--text-dark);
    }
    .btn-mark-recd.done {
      background: var(--accent-mint-badge);
      color: var(--accent-mint-text);
    }
    .btn-dots {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-light);
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .btn-dots:hover {
      color: var(--text-dark);
    }

    
    /* Clickable Maturity Scroll Container & Bars */
    .maturity-chart-scroll {
      display: flex;
      align-items: flex-end;
      height: 108px;
      gap: 8px;
      padding: 6px 4px 6px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      width: 100%;
      box-sizing: border-box;
    }
    .maturity-chart-scroll::-webkit-scrollbar {
      display: none;
    }
    .maturity-year-col {
      flex: 0 0 34px;
      width: 34px;
      min-width: 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 4px 2px 2px;
      border-radius: 8px;
      transition: all 0.15s ease;
      box-sizing: border-box;
    }
    .maturity-year-col:hover, .maturity-year-col:active {
      background: #f1f5f9;
      transform: scale(0.96);
    }
    .maturity-year-col .bar-pill {
      width: 14px;
      border-radius: 4px 4px 0 0;
      background: var(--brand-green);
      box-shadow: 0 2px 6px rgba(10, 62, 47, 0.2);
      transition: height 0.3s ease, background 0.15s ease;
    }
    .maturity-year-col:hover .bar-pill {
      background: #047857;
    }


    /* Small Action Pill Buttons (Edit, Delete, Sell) */
    .act-pill-btn {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 700;
      border: 1px solid var(--card-border);
      background: #ffffff;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .act-pill-btn:hover {
      background: #f8fafc;
      color: var(--text-dark);
    }
    .act-pill-btn.danger {
      color: var(--accent-coral-text);
      border-color: var(--accent-coral-badge);
      background: var(--accent-coral-bg);
    }
    .act-pill-btn.sell {
      color: #b45309;
      border-color: #fef3c7;
      background: #fffbeb;
    }

    
    /* ── SGB Gold Live Valuation Card Styling ── */
    .sgb-icon-badge {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: #fef3c7;
      border: 1px solid #fde68a;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(180, 83, 9, 0.12);
      flex-shrink: 0;
    }
    .sgb-price-badge {
      font-size: 12.5px;
      font-weight: 800;
      color: #92400e;
      background: #fef3c7;
      border: 1px solid #fde68a;
      padding: 4px 10px;
      border-radius: 20px;
      box-shadow: 0 1px 4px rgba(180, 83, 9, 0.08);
      white-space: nowrap;
    }
    .custom-gold-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(to right, #d97706 0%, #f59e0b var(--slider-pct, 31%), #e2e8f0 var(--slider-pct, 31%), #e2e8f0 100%);
      outline: none;
      cursor: pointer;
      margin: 0;
      padding: 0;
      touch-action: pan-x;
    }
    .custom-gold-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ffffff;
      border: 3.5px solid #d97706;
      box-shadow: 0 2px 10px rgba(217, 119, 6, 0.45);
      cursor: grab;
      transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s ease;
    }
    .custom-gold-slider::-webkit-slider-thumb:active {
      cursor: grabbing;
      transform: scale(1.22);
      box-shadow: 0 4px 16px rgba(217, 119, 6, 0.6);
    }
    .custom-gold-slider::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ffffff;
      border: 3.5px solid #d97706;
      box-shadow: 0 2px 10px rgba(217, 119, 6, 0.45);
      cursor: grab;
    }
    .sgb-preset-btn {
      flex: 1;
      padding: 4px 2px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      border: 1px solid #fde68a;
      background: #ffffff;
      color: #92400e;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .sgb-preset-btn:hover {
      background: #fef3c7;
    }
    .sgb-preset-btn.active {
      background: #d97706;
      color: #ffffff;
      border-color: #b45309;
      box-shadow: 0 2px 6px rgba(217, 119, 6, 0.3);
    }

    /* Bottom Navigation Bar */
    .bottom-tab-bar {
      height: 64px;
      background: #ffffff;
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
      flex-shrink: 0;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.03);
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--text-light);
      font-size: 10px;
      font-weight: 700;
      padding: 6px 12px;
      transition: all 0.2s ease;
    }
    .tab-item.active {
      color: var(--brand-green);
    }
    .tab-item svg {
      transition: transform 0.2s ease;
    }
    .tab-item.active svg {
      transform: scale(1.1);
    }

    /* PIN Security Modal Styles */
    .pin-dots-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 18px 0 24px;
    }
    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      background: transparent;
      transition: all 0.15s ease;
    }
    .pin-dot.filled {
      background: var(--brand-green);
      border-color: var(--brand-green);
      box-shadow: 0 0 10px rgba(10, 62, 47, 0.3);
      transform: scale(1.15);
    }
    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 270px;
      margin: 0 auto;
    }
    .pin-key {
      height: 52px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: #f8faf9;
      font-size: 19px;
      font-weight: 700;
      color: var(--text-dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }
    .pin-key:active {
      background: #e2e8f0;
      transform: scale(0.95);
    }
    .pin-key.action-key {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .pin-error-msg {
      color: var(--accent-coral-text);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      height: 18px;
      margin-bottom: 12px;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake {
      animation: shake 0.35s ease-in-out;
    }

    /* Modal / Drawer */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-sheet {
      background: #ffffff;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 460px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.15);
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-drag-bar {
      width: 36px;
      height: 4px;
      background: #e2e8f0;
      border-radius: 9999px;
      margin: 0 auto 14px;
    }
    .modal-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .modal-close-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: #f8fafc;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

  </style>

    function fmtShort(val) {
      if (isPrivacyMode) return '₹ ••••••';
      val = val || 0;
      if (val >= 10000000) return '₹ ' + (val / 10000000).toFixed(2) + ' Cr';
      if (val >= 100000) return '₹ ' + (val / 100000).toFixed(2) + ' L';
      return '₹ ' + Math.round(val).toLocaleString('en-IN');

    function toDDMMYYYY(dateStr) {
      if (!dateStr) return '—';
      const clean = dateStr.slice(0, 10);
      const p = clean.split('-');
      if (p.length === 3) return p[2] + '-' + p[1] + '-' + p[0];
      return dateStr;
    }

    function calcSellTotal() {
      const qty = parseFloat(document.getElementById('sell_qty').value) || 0;
      const rate = parseFloat(document.getElementById('sell_rate').value) || 0;
      const tot = qty * rate;
      const el = document.getElementById('sell_total');
      if (el) el.value = '₹ ' + Math.round(tot).toLocaleString('en-IN');
    }

    function confirmSellHolding(e, hId) {
      e.preventDefault();
      const hIdx = holdings.findIndex(i => i.id === hId);
      if (hIdx === -1) return;
      const h = holdings[hIdx];
      const sellQty = parseFloat(document.getElementById('sell_qty').value) || 0;
      const sellRate = parseFloat(document.getElementById('sell_rate').value) || 0;
      const sellDate = document.getElementById('sell_date').value;
      const totalProceeds = sellQty * sellRate;

      if (sellQty >= h.qty) {
        // Full Exit: remove holding
        holdings.splice(hIdx, 1);
        // Cancel future coupons for this asset
        transactions = transactions.filter(t => !(t.asset === h.asset_name && t.holder === h.portfolio && t.date >= sellDate));
      } else {
        // Partial Exit: reduce quantity & proportional face value
        const remQty = h.qty - sellQty;
        const ratio = remQty / h.qty;
        h.qty = remQty;
        h.face_value = Math.round(h.face_value * ratio);
        h.annual_gross = Math.round(h.annual_gross * ratio * 100) / 100;
        if (h.grams > 0) h.grams = remQty;
        // Adjust future coupons proportionally
        transactions.forEach(t => {
          if (t.asset === h.asset_name && t.holder === h.portfolio && t.date >= sellDate) {
            t.amount = Math.round(t.amount * ratio);
          }
        });
      }

      safeSet('fc_holdings_v7', holdings);
      safeSet('fc_tx_v7', transactions);
      closeModal();
      alert('✓ Successfully sold ' + sellQty + ' ' + h.qty_unit + ' of ' + h.asset_name + '\nTotal Realized: ₹ ' + Math.round(totalProceeds).toLocaleString('en-IN'));
      render();
    }

    function getActiveAlerts() {
      const alerts = [];
      transactions.forEach(t => {
        if (!recdMap[t.id]) {
          const tDate = t.date;
          if (tDate >= '2026-04-01' && tDate <= '2026-05-15') {
            alerts.push({ type: 'inflow', item: t });
          }
        }
      });
      insurance.forEach(ins => {
        const pptInfo = calcPolicyPptStatus(ins.inception_date || '2021-09-28', ins.ppt_years, ins.policy_term);
        if (pptInfo.isWithinPpt && !paidMap[ins.id]) {
          alerts.push({ type: 'insurance', item: ins, pptInfo: pptInfo });
        }
      });
      return alerts;
    }

    // ── INSURANCE PPT & INCEPTION DATE ENGINE ──
    function calcPolicyPptStatus(inceptionDate, pptYears, policyTerm) {
      if (!inceptionDate || !pptYears) {
        return { isWithinPpt: true, isCompleted: false, paymentYearNum: 1, endPptYear: 2030, maturityYear: 2036, nextDueDate: '2026-09-28', statusText: 'Active' };
      }
      const incepParts = inceptionDate.split('-');
      const incepYear = parseInt(incepParts[0], 10) || 2021;
      const incepMonth = incepParts[1] || '09';
      const incepDay = incepParts[2] || '28';
      const ppt = parseInt(pptYears, 10) || 10;
      const term = parseInt(policyTerm, 10) || 16;

      const dueYear = (parseInt(incepMonth, 10) >= 4) ? 2026 : 2027;
      const nextDueDate = dueYear + '-' + incepMonth + '-' + incepDay;
      const paymentYearNum = dueYear - incepYear + 1;
      const endPptYear = incepYear + ppt - 1;
      const maturityYear = incepYear + term;

      const isWithinPpt = (paymentYearNum >= 1 && paymentYearNum <= ppt);
      const isCompleted = paymentYearNum > ppt;

      let statusText = '';
      if (isCompleted) {
        statusText = '✓ PPT Completed (Fully Paid Up till ' + maturityYear + ')';
      } else if (paymentYearNum < 1) {
        statusText = 'Starts in ' + incepYear;
      } else {
        const remYears = ppt - paymentYearNum;
        statusText = 'Year ' + paymentYearNum + ' of ' + ppt + ' (' + remYears + ' yr' + (remYears === 1 ? '' : 's') + ' remaining, PPT till ' + endPptYear + ')';
      }

      return { isWithinPpt, isCompleted, paymentYearNum, endPptYear, maturityYear, nextDueDate, statusText };
    }

    function autoCalcInsuranceFromInception() {
      const incepEl = document.getElementById('ins_inception');
      const pptEl = document.getElementById('ins_ppt');
      const termEl = document.getElementById('ins_term');
      const dueEl = document.getElementById('ins_due');
      const infoEl = document.getElementById('ins_auto_calc_info');

      if (!incepEl || !pptEl) return;
      const incep = incepEl.value;
      const ppt = pptEl.value;
      const term = termEl ? termEl.value : ppt;

      const info = calcPolicyPptStatus(incep, ppt, term);
      if (dueEl && incep) {
        dueEl.value = info.nextDueDate;
      }
      if (infoEl) {
        if (info.isCompleted) {
          infoEl.style.background = '#ecfdf5';
          infoEl.style.borderColor = '#a7f3d0';
          infoEl.style.color = '#047857';
          infoEl.innerHTML = '<b>' + info.statusText + '</b><br>PPT finished in ' + info.endPptYear + '. No premium due for FY 2026-27. Life cover continues till ' + info.maturityYear + '.';
        } else {
          infoEl.style.background = '#f0fdf4';
          infoEl.style.borderColor = '#bbf7d0';
          infoEl.style.color = '#166534';
          infoEl.innerHTML = '<b>' + info.statusText + '</b><br>FY 2026-27 Premium Due Date: <b>' + toDDMMYYYY(info.nextDueDate) + '</b>. Reminders active until PPT ends in ' + info.endPptYear + '.';
        }
      }
    }

    function saveExpense(e, editId) {
      e.preventDefault();
      const title = document.getElementById('exp_title').value.trim();
      const holder = document.getElementById('exp_holder').value;
      const category = document.getElementById('exp_cat').value;
      const paid_from = document.getElementById('exp_acc').value;
      const amount = parseFloat(document.getElementById('exp_amount').value) || 0;
      const due_date = document.getElementById('exp_date').value;
      const frequency = document.getElementById('exp_freq').value;
      const bill_no = document.getElementById('exp_bill_no').value.trim() || '—';

      if (editId) {
        const idx = expenses.findIndex(i => i.id === editId);
        if (idx !== -1) {
          expenses[idx] = {
            ...expenses[idx],
            title, holder, category, paid_from, amount, due_date, frequency,
            is_recurring: frequency !== 'One-Time', bill_no
          };
        }
      } else {
        const newExp = {
          id: 'exp_' + Date.now(),
          title, holder, category, paid_from, amount, due_date, frequency,
          is_recurring: frequency !== 'One-Time', bill_no
        };
        expenses.push(newExp);
      }
      safeSet('fc_expenses_v7', expenses);
      closeModal();
      render();
    }

      html += '</select></div>';
      html += '<div><label style="font-weight:700;display:block;margin-bottom:3px;">Asset Name</label><input type="text" id="new_name" placeholder="e.g. G-Sec 7.30% GS 2053" required style="width:100%;padding:8px;border-radius:10px;border:1px solid var(--card-border);"></div>';
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">';
      html += '  <div><label style="font-weight:700;display:block;margin-bottom:3px;">Coupon %</label><input type="number" step="0.01" id="new_coupon" placeholder="7.30" required style="width:100%;padding:8px;border-radius:10px;border:1px solid var(--card-border);"></div>';
      html += '  <div><label style="font-weight:700;display:block;margin-bottom:3px;">Face Value (₹)</label><input type="number" id="new_fv" placeholder="100000" required style="width:100%;padding:8px;border-radius:10px;border:1px solid var(--card-border);"></div>';
      html += '</div>';
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">';
      html += '  <div><label style="font-weight:700;display:block;margin-bottom:3px;">Quantity / Units</label><input type="number" id="new_qty" placeholder="1000" required style="width:100%;padding:8px;border-radius:10px;border:1px solid var(--card-border);"></div>';
      html += '  <div><label style="font-weight:700;display:block;margin-bottom:3px;">Maturity Date</label><input type="date" id="new_mdate" required style="width:100%;padding:8px;border-radius:10px;border:1px solid var(--card-border);"></div>';
      html += '</div>';
      html += '<button type="submit" style="background:var(--brand-green);color:#ffffff;border:none;padding:10px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;margin-top:6px;">Save Investment</button>';
      html += '</form>';
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function saveNewHolding(e) {
      e.preventDefault();
      const holder = document.getElementById('new_holder').value;
      const name = document.getElementById('new_name').value;
      const coupon = parseFloat(document.getElementById('new_coupon').value) || 0;
      const fv = parseFloat(document.getElementById('new_fv').value) || 0;
      const qty = parseFloat(document.getElementById('new_qty').value) || 1;
      const mdate = document.getElementById('new_mdate').value;

      const newH = {
        id: 'h_custom_' + Date.now(),
        portfolio: holder,
        asset_name: name,
        asset_type: 'Govt Bond (G-Sec)',
        isin: 'IN-NEW-' + Math.floor(Math.random()*100000),
        coupon_pct: coupon,
        interest_dates: 'Annual',
        maturity_date: mdate,
        maturity_year: mdate ? mdate.slice(0, 4) : '2099',
        annual_gross: (fv * coupon) / 100,
        face_value: fv,
        grams: 0,
        qty: qty,
        qty_unit: 'Units',
        unit_fv: fv / qty
      };
      holdings.push(newH);
      safeSet('fc_holdings_v7', holdings);
      closeModal();
      render();
    }

    
    // ── Seamless SGB Slider Handlers (Zero-Lag 60fps Live Update) ──
    function onSgbSliderInput(val) {
      sgbMarketPrice = parseInt(val) || 9800;
      const sliderMin = 6000;
      const sliderMax = 18000;
      const sliderPct = Math.min(100, Math.max(0, ((sgbMarketPrice - sliderMin) / (sliderMax - sliderMin)) * 100));
      
      const slider = document.getElementById('sgbSliderInput');
      if (slider) {
        slider.style.setProperty('--slider-pct', sliderPct.toFixed(1) + '%');
      }

      const badge = document.getElementById('sgbPriceBadge');
      if (badge) {
        badge.textContent = isPrivacyMode ? '₹ ••••• / g' : '₹ ' + sgbMarketPrice.toLocaleString('en-IN') + ' / g';
      }

      const totValEl = document.getElementById('sgbTotalValText');
      const lakhsEl = document.getElementById('sgbLakhsText');
      const totVal = 297 * sgbMarketPrice;
      if (totValEl) {
        totValEl.textContent = isPrivacyMode ? '₹ ••••••••' : '₹ ' + totVal.toLocaleString('en-IN');
      }
      if (lakhsEl) {
        lakhsEl.textContent = isPrivacyMode ? '' : ' (' + (totVal / 100000).toFixed(2) + ' Lakhs)';
      }
    }

    function onSgbSliderChange(val) {
      sgbMarketPrice = parseInt(val) || 9800;
      safeSet('fc_sgb_price', sgbMarketPrice);
      render();
    }

    function setSgbPreset(val) {
      sgbMarketPrice = val;
      safeSet('fc_sgb_price', sgbMarketPrice);
      render();
    }

    // ── Live Clock ──
    function updateClock() {
      const d = new Date();
      const h = d.getHours();
      const m = d.getMinutes();
      document.getElementById('topClock').innerText = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ── Start App ──
    render();
  </script>
</body>
</html>
